plugins {
    id 'org.springframework.boot' version '3.2.5' // Downgrade to a compatible version
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'io.freefair.lombok' version '8.6'
}

group = 'com.bazarbozorg.typeservice.batch'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    mavenLocal()
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.maven.apache.org/maven2" }
    maven { url 'https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-java/maven/v1' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) // Updated to Java 21
    }
    compileJava {
        options.compilerArgs << '-Xlint:unchecked'
    }
    compileTestJava {
        options.compilerArgs << '-Xlint:unchecked'
    }
}

ext {
    set('jjwtVersion', "0.12.5") // Updated JWT version
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring Security & JWT Authentication
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // Swagger/OpenAPI Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.4.0'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // JWT Library
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Spring Cloud for distributed batch processing
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.1'

    // REST client for TypeList web service
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Jackson for JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'

    // Apache Commons
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'commons-io:commons-io:2.6'

    // Excel support - updated POI
    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // Database drivers (H2 for development, PostgreSQL for production)
    runtimeOnly 'com.h2database:h2:2.2.224'
    runtimeOnly 'org.postgresql:postgresql:42.7.2'

    // Tracing dependencies
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave:2.16.4'
    implementation 'io.zipkin.reporter2:zipkin-reporter:2.16.4'
    implementation 'io.zipkin.brave:brave:5.14.1'
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.springframework.security:spring-security-test'

    // Internal dependency - make sure this is available in your local Maven repository
    implementation 'com.bazarbozorg.typelistservice:bb-typelistservice-client:0.0.1-SNAPSHOT'
}


tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    archiveBaseName = 'batch-processing'
    archiveVersion = version.toString()
    manifest {
        attributes 'Main-Class': 'org.springframework.boot.loader.JarLauncher'
    }
}

shadowJar {
    archiveBaseName = 'batch-processing'
    archiveClassifier = 'all'
    archiveVersion = version.toString()
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'org.springframework.boot.loader.JarLauncher'
    }
}

wrapper {
    gradleVersion = '8.14'
    distributionType = Wrapper.DistributionType.BIN
}